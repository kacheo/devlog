version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - nolintlint
    - gosec

  settings:
    nolintlint:
      allow-unused: false
      require-specific: true

  exclusions:
    rules:
      - linters: [errcheck]
        text: "fmt\\.(Fprintf|Fprintln|Fprint)"
      - path: _test\.go
        linters: [errcheck]
        text: 'Error return value of .*(Chmod|Remove).* is not checked'
      # G204: exec.Command with variable args — all callers use user-configured paths
      # (git repo paths, gh repo slugs, editor from $EDITOR/$VISUAL), not untrusted input.
      - linters: [gosec]
        text: "G204:"
      # G304/G703: file paths from user config are not untrusted input.
      - linters: [gosec]
        text: "G304:"
      - linters: [gosec]
        text: "G703:"
      # Test files: permission values in temp dirs and unhandled test-server writes are not a security concern.
      - path: _test\.go
        linters: [gosec]
        text: "(G104|G301|G302|G306):"
