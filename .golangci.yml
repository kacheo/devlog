version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - nolintlint

  settings:
    nolintlint:
      allow-unused: false
      require-specific: true

  exclusions:
    rules:
      - linters: [errcheck]
        text: "fmt\\.(Fprintf|Fprintln|Fprint)"
      - path: _test\.go
        linters: [errcheck]
        text: 'Error return value of .*(Chmod|Remove).* is not checked'
