version: 2

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - nolintlint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    disable-default-exclusions: true
    exclude-functions:
      - fmt.Fprintln
      - fmt.Fprintf

  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true

issues:
  exclude-rules:
    # Test cleanup: defensive, rarely actionable
    - path: _test\.go
      linters:
        - errcheck
      text: 'Error return value of .*(Chmod|Remove).* is not checked'