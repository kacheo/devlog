name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not extract coverage total — coverage.out may be empty"
            exit 1
          fi
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN {exit ($COVERAGE >= 70)}"; then
            echo "❌ Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o /tmp/devlog .
      - name: Run integration tests
        run: go test -tags=integration -race -timeout=2m -v ./tests/integration/...
        env:
          DEVLOG_TEST_BINARY: /tmp/devlog

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o /tmp/devlog .
      - name: Run regression tests
        run: go test -tags=regression -timeout=5m -v ./tests/regression/...
        env:
          DEVLOG_TEST_BINARY: /tmp/devlog
